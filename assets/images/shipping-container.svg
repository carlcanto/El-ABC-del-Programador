<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <rect width="500" height="350" rx="12" fill="#F8FAFC"/>
  <!-- Ocean background -->
  <rect x="20" y="180" width="460" height="150" rx="8" fill="#DBEAFE" opacity=".5"/>
  <!-- Waves -->
  <path d="M20 220 Q60 210 100 220 Q140 230 180 220 Q220 210 260 220 Q300 230 340 220 Q380 210 420 220 Q460 230 480 220" stroke="#93C5FD" stroke-width="2" fill="none" opacity=".4"/>
  <path d="M20 240 Q70 230 120 240 Q170 250 220 240 Q270 230 320 240 Q370 250 420 240 Q470 230 480 240" stroke="#93C5FD" stroke-width="2" fill="none" opacity=".3"/>
  <!-- Container body -->
  <rect x="80" y="60" width="340" height="140" rx="4" fill="#2496ED" stroke="#1E293B" stroke-width="2.5" opacity=".9"/>
  <!-- Container lines -->
  <line x1="80" y1="105" x2="420" y2="105" stroke="#1E293B" stroke-width="1.5" opacity=".15"/>
  <line x1="80" y1="150" x2="420" y2="150" stroke="#1E293B" stroke-width="1" opacity=".1"/>
  <!-- Container ridges -->
  <rect x="80" y="60" width="340" height="12" rx="2" fill="#1E293B" opacity=".12"/>
  <rect x="80" y="188" width="340" height="12" rx="2" fill="#1E293B" opacity=".12"/>
  <!-- Container door details -->
  <line x1="250" y1="72" x2="250" y2="188" stroke="#1E293B" stroke-width="2" opacity=".2"/>
  <!-- Handles -->
  <rect x="180" y="145" width="6" height="20" rx="3" fill="#1E293B" opacity=".25"/>
  <rect x="260" y="145" width="6" height="20" rx="3" fill="#1E293B" opacity=".25"/>
  <!-- Container markings -->
  <rect x="100" y="115" width="60" height="8" rx="2" fill="#1E293B" opacity=".15"/>
  <rect x="100" y="128" width="80" height="6" rx="2" fill="#1E293B" opacity=".1"/>
  <rect x="310" y="78" width="90" height="16" rx="2" fill="#F0F9FF" opacity=".6"/>
  <!-- Shadow -->
  <ellipse cx="250" cy="205" rx="180" ry="8" fill="#1E293B" opacity=".06"/>
  <!-- Stack indicator -->
  <rect x="85" y="48" width="30" height="8" rx="2" fill="#2496ED" opacity=".35"/>
  <rect x="385" y="48" width="30" height="8" rx="2" fill="#2496ED" opacity=".35"/>
</svg>